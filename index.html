<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>**** Control Remoto - Rotor de Antena PY2ZP ****</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>


<style>


body {

    font-family: Arial, sans-serif;

    text-align:center;

    background:#121212;

    color:white;

    margin-top:20px;

}



#conexion {

    font-size:15px;

    margin-bottom:15px;

    color:red;

}



.btn {

    padding:12px 20px;

    font-size:16px;

    margin:8px;

    cursor:pointer;

    border:none;

    border-radius:6px;

    font-weight:bold;

    color:white;

}



.btn-power {

    background:#ff9800;

}



.btn-cw {

    background:#2196F3;

}



.btn-ccw {

    background:#9c27b0;

}



.btn-stop {

    background:#f44336;

}



.btn-active {

    background:#00c853 !important;

}




/* ========================= */
/* BRUJULA */
/* ========================= */


.compass {

    width:260px;

    height:260px;

    border:5px solid white;

    border-radius:50%;

    margin:25px auto;

    position:relative;

}




.mark {

    position:absolute;

    width:100%;

    height:100%;

    transform-origin:center;

    text-align:center;

}



.mark span {

    position:absolute;

    top:3px;

    left:50%;

    transform:translateX(-50%);

    font-size:12px;

}



.cardinal {

    font-size:22px !important;

    font-weight:bold;

}



.needle {


    width:5px;

    height:115px;

    background:red;

    position:absolute;

    left:50%;

    bottom:50%;

    transform-origin:bottom center;

    transform:rotate(0deg);

    transition:transform 0.4s;

}




.center {


    width:14px;

    height:14px;

    background:white;

    border-radius:50%;

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);


}



#degree {


    font-size:25px;

    font-weight:bold;


}




</style>


</head>


<body>



<h1>
**** Control Remoto - Rotor de Antena PY2ZP ****
</h1>



<div id="conexion">
Estado: Desconectado del Broker MQTT
</div>




<p>

Posición:

<span id="pos">
0
</span>°

<br>


Power:

<span id="pwr">
OFF
</span>


</p>





<!-- ========================= -->
<!-- BRUJULA -->
<!-- ========================= -->


<div class="compass">


<div id="marks"></div>


<div id="needle" class="needle"></div>


<div class="center"></div>


</div>



<div id="degree">
0°
</div>





<!-- ========================= -->
<!-- BOTONES -->
<!-- ========================= -->


<button

id="powerBtn"

class="btn btn-power"

onclick="enviarComando('POWER_ON')">


POWER


</button>



<br>




<button

id="cwBtn"

class="btn btn-cw"

onmousedown="botonCW(true)"

onmouseup="botonCW(false)"

ontouchstart="botonCW(true)"

ontouchend="botonCW(false)">



Giro Horario



</button>





<button

id="ccwBtn"

class="btn btn-ccw"

onmousedown="botonCCW(true)"

onmouseup="botonCCW(false)"

ontouchstart="botonCCW(true)"

ontouchend="botonCCW(false)">



Giro Antihorario



</button>




<br>



<button

class="btn btn-stop"

onclick="enviarComando('STOP')">


STOP


</button>





<script>




//================================================
// CREAR BRUJULA CADA 15 GRADOS
//================================================


let marks =
document.getElementById("marks");



for(let deg=0; deg<360; deg+=15)

{


    let item =
    document.createElement("div");



    item.className="mark";



    item.style.transform =
    "rotate("+deg+"deg)";



    let text =
    document.createElement("span");



    if(deg===0)

        text.innerHTML="N";


    else if(deg===90)

        text.innerHTML="E";


    else if(deg===180)

        text.innerHTML="S";


    else if(deg===270)

        text.innerHTML="W";


    else

        text.innerHTML=deg+"°";



    if(deg%90===0)

        text.className="cardinal";



    item.appendChild(text);


    marks.appendChild(item);



}



//================================================
// MQTT WEB SOCKET SEGURO (HTTPS GITHUB PAGES)
//================================================


const brokerHost = "broker.hivemq.com";

const brokerPort = 8884;


const clientId =
"WebClient_Rotor_" + Math.floor(Math.random()*100000);



let client =
new Paho.MQTT.Client(

    brokerHost,

    Number(brokerPort),

    clientId

);




client.onConnectionLost =
onConnectionLost;


client.onMessageArrived =
onMessageArrived;




client.connect({

    useSSL:true,

    onSuccess:onConnect,


    onFailure:function(error)

    {

        console.log("MQTT ERROR");

        console.log(error);

        document.getElementById("conexion").innerHTML =
        "Error MQTT";

        document.getElementById("conexion").style.color =
        "red";

    }

});





//================================================
// CONEXION CORRECTA
//================================================


function onConnect()

{


    document.getElementById("conexion").innerHTML =
    "Estado: Conectado OK";


    document.getElementById("conexion").style.color =
    "#00c853";



    client.subscribe("rotor/estado");



}






//================================================
// PERDIDA DE CONEXION
//================================================


function onConnectionLost(responseObject)

{


    if(responseObject.errorCode !== 0)

    {


        document.getElementById("conexion").innerHTML =
        "Estado: Conexion perdida";


        document.getElementById("conexion").style.color =
        "red";



        setTimeout(function(){


            client.connect({

                useSSL:true,

                onSuccess:onConnect


            });


        },5000);



    }


}






//================================================
// RECEPCION ESTADO DEL ESP
//================================================


function onMessageArrived(message)

{


    if(message.destinationName !== "rotor/estado")

        return;




    let data;



    try

    {

        data =
        JSON.parse(message.payloadString);

    }

    catch(e)

    {

        console.log("JSON ERROR");

        return;

    }







    //=============================
    // POSICION
    //=============================


    let pos =
    Number(data.pos);



    document.getElementById("pos").innerHTML =
    pos.toFixed(0);



    document.getElementById("degree").innerHTML =
    pos.toFixed(0)+"°";





    // mover aguja


    document.getElementById("needle").style.transform =
    "rotate("+pos+"deg)";








    //=============================
    // POWER
    //=============================


    let powerBtn =
    document.getElementById("powerBtn");


    let pwr =
    document.getElementById("pwr");



    if(data.power)

    {

        powerBtn.classList.add("btn-active");

        pwr.innerHTML="ON";


    }

    else

    {

        powerBtn.classList.remove("btn-active");

        pwr.innerHTML="OFF";

    }







    //=============================
    // CW
    //=============================


    let cwBtn =
    document.getElementById("cwBtn");



    if(data.cw)

    {

        cwBtn.classList.add("btn-active");


    }

    else

    {

        cwBtn.classList.remove("btn-active");


    }







    //=============================
    // CCW
    //=============================


    let ccwBtn =
    document.getElementById("ccwBtn");



    if(data.ccw)

    {

        ccwBtn.classList.add("btn-active");


    }

    else

    {

        ccwBtn.classList.remove("btn-active");


    }



}






//================================================
// ENVIO MQTT
//================================================


function enviarComando(cmd)

{


    if(!client.isConnected())

    {

        console.log("MQTT no conectado");

        return;

    }



    let message =
    new Paho.MQTT.Message(cmd);



    message.destinationName =
    "rotor/control";



    client.send(message);



}


//================================================
// BOTONES MOMENTANEOS CW / CCW
//================================================


let cwPressed = false;

let ccwPressed = false;





//================================================
// CW
//================================================


function botonCW(estado)

{


    if(estado)

    {


        if(!cwPressed)

        {

            cwPressed=true;


            enviarComando("CW_ON");


        }


    }

    else

    {


        if(cwPressed)

        {

            cwPressed=false;


            enviarComando("CW_OFF");


        }


    }


}






//================================================
// CCW
//================================================


function botonCCW(estado)

{


    if(estado)

    {


        if(!ccwPressed)

        {

            ccwPressed=true;


            enviarComando("CCW_ON");


        }


    }

    else

    {


        if(ccwPressed)

        {

            ccwPressed=false;


            enviarComando("CCW_OFF");


        }


    }


}







//================================================
// SEGURIDAD
// SI SE SALE DE LA PAGINA,
// LIBERA LOS BOTONES
//================================================



window.addEventListener("blur",function(){



    if(cwPressed)

    {


        cwPressed=false;


        enviarComando("CW_OFF");


    }




    if(ccwPressed)

    {


        ccwPressed=false;


        enviarComando("CCW_OFF");


    }



});








//================================================
// EVITAR MENU CONTEXTUAL EN MOVIL
//================================================



document.addEventListener(

"contextmenu",

function(e)

{

    e.preventDefault();

}

);





</script>


</body>


</html>

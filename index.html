<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>**** Control Remoto - Rotor de Antena PY2ZP ****</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
text-align:center;
background:#121212;
color:white;
margin-top:20px;
}

#conexion{
font-size:15px;
margin-bottom:10px;
color:red;
}

#control{
font-size:16px;
margin-bottom:15px;
}

.btn{
padding:12px 20px;
font-size:16px;
margin:8px;
cursor:pointer;
border:none;
border-radius:6px;
font-weight:bold;
color:white;
}

.btn:disabled{
opacity:.35;
cursor:not-allowed;
}

.btn-power{background:#ff9800;}
.btn-cw{background:#2196F3;}
.btn-ccw{background:#9c27b0;}

.btn-active{
background:#00c853!important;
}

.giro-container{
display:flex;
justify-content:center;
gap:70px;
margin-top:15px;
}

.lado{
display:flex;
flex-direction:column;
align-items:center;
}

.flecha{
width:40px;
height:40px;
margin-bottom:5px;
}

.limite{
font-size:14px;
color:#cccccc;
margin-top:5px;
}


/* BRUJULA */

.compass{
width:260px;
height:260px;
border:5px solid white;
border-radius:50%;
margin:25px auto;
position:relative;
}

.mark{
position:absolute;
width:100%;
height:100%;
transform-origin:center;
text-align:center;
}

.mark span{
position:absolute;
top:3px;
left:50%;
transform:translateX(-50%);
font-size:12px;
}

.cardinal{
font-size:22px!important;
font-weight:bold;
}

.needle{
width:5px;
height:115px;
background:red;
position:absolute;
left:50%;
bottom:50%;
transform-origin:bottom center;
transform:rotate(0deg);
transition:.4s;
}

.center{
width:14px;
height:14px;
background:white;
border-radius:50%;
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

#degree{
font-size:25px;
font-weight:bold;
}
</style>
</head>

<body>

<h1>**** Control Remoto - Rotor de Antena PY2ZP ****</h1>

<div id="conexion">
Estado: Desconectado del Broker MQTT
</div>

<div id="control">
Control: Sin asignar<br>
Conectados: 0
</div>

<p>
Posición:
<span id="pos">0</span>°
<br>
Power:
<span id="pwr">OFF</span>
</p>


<div class="compass">

<div id="marks"></div>

<div id="needle" class="needle"></div>

<div class="center"></div>

</div>

<div id="degree">
0°
</div>


<br>


<button id="powerBtn"
class="btn btn-power"
onclick="enviarComando('POWER_ON')">
POWER
</button>


<div class="giro-container">


<div class="lado">


<div class="flecha">
<svg width="40" height="40" viewBox="0 0 40 40">
<path d="M10 28 A14 14 0 0 1 28 10"
fill="none"
stroke="white"
stroke-width="3"
stroke-linecap="round"/>
<polygon points="26,7 33,10 27,15"
fill="white"/>
</svg>
</div>


<button id="cwBtn"
class="btn btn-cw"
onmousedown="botonCW(true)"
onmouseup="botonCW(false)"
ontouchstart="botonCW(true)"
ontouchend="botonCW(false)">
Giro Horario
</button>

<div class="limite">
Máximo 190°
</div>

</div>



<div class="lado">


<div class="flecha">
<svg width="40" height="40" viewBox="0 0 40 40">
<path d="M30 28 A14 14 0 0 0 12 10"
fill="none"
stroke="white"
stroke-width="3"
stroke-linecap="round"/>
<polygon points="14,7 7,10 13,15"
fill="white"/>
</svg>
</div>


<button id="ccwBtn"
class="btn btn-ccw"
onmousedown="botonCCW(true)"
onmouseup="botonCCW(false)"
ontouchstart="botonCCW(true)"
ontouchend="botonCCW(false)">
Giro Antihorario
</button>

<div class="limite">
Máximo 170°
</div>

</div>


</div>
<script>

//==============================
// CREAR BRUJULA
//==============================

let marks=document.getElementById("marks");

for(let deg=0;deg<360;deg+=15){

let item=document.createElement("div");
item.className="mark";
item.style.transform="rotate("+deg+"deg)";

let text=document.createElement("span");

if(deg===0)text.innerHTML="N";
else if(deg===90)text.innerHTML="E";
else if(deg===180)text.innerHTML="S";
else if(deg===270)text.innerHTML="W";
else text.innerHTML=deg+"°";

if(deg%90===0)text.className="cardinal";

item.appendChild(text);
marks.appendChild(item);

}


//==============================
// MQTT
//==============================

const brokerHost="broker.hivemq.com";
const brokerPort=8884;

const clientId="WebClient_Rotor_"+Math.floor(Math.random()*100000);


let client=new Paho.MQTT.Client(
brokerHost,
Number(brokerPort),
clientId
);


// VARIABLES CONTROL

let soyMandante=false;
let conectado=false;
let usuarios=0;


//==============================
// TOPICOS CONTROL
//==============================

const TOP_ESTADO="rotor/estado";
const TOP_CONTROL="rotor/control";
const TOP_LOGIN="rotor/login";
const TOP_LOGOUT="rotor/logout";
const TOP_USUARIOS="rotor/usuarios";



client.onConnectionLost=onConnectionLost;
client.onMessageArrived=onMessageArrived;



client.connect({

useSSL:true,

onSuccess:onConnect,

onFailure:function(){

document.getElementById("conexion").innerHTML=
"Error MQTT";

document.getElementById("conexion").style.color="red";

}

});




//==============================
// CONECTADO
//==============================

function onConnect(){

conectado=true;

document.getElementById("conexion").innerHTML=
"Estado: Conectado OK";

document.getElementById("conexion").style.color="#00c853";


client.subscribe(TOP_ESTADO);
client.subscribe(TOP_USUARIOS);


// anunciar presencia

let msg=new Paho.MQTT.Message(clientId);

msg.destinationName=TOP_LOGIN;

client.send(msg);


actualizarControl();

}



//==============================
// PERDIDA CONEXION
//==============================


function onConnectionLost(obj){

if(obj.errorCode!==0){

document.getElementById("conexion").innerHTML=
"Estado: Conexion perdida";

document.getElementById("conexion").style.color="red";

setTimeout(function(){

client.connect({

useSSL:true,

onSuccess:onConnect

});

},5000);

}

}



//==============================
// ESTADO DEL ROTOR
//==============================


function onMessageArrived(message){



//----------------------------
// ESTADO ROTOR
//----------------------------

if(message.destinationName===TOP_ESTADO){


let data;

try{

data=JSON.parse(message.payloadString);

}catch(e){

return;

}



let pos=Number(data.pos);


document.getElementById("pos").innerHTML=
pos.toFixed(0);


document.getElementById("degree").innerHTML=
pos.toFixed(0)+"°";



document.getElementById("needle").style.transform=
"rotate("+pos+"deg)";



// POWER

let powerBtn=document.getElementById("powerBtn");

if(data.power){

powerBtn.classList.add("btn-active");

document.getElementById("pwr").innerHTML="ON";

}else{

powerBtn.classList.remove("btn-active");

document.getElementById("pwr").innerHTML="OFF";

}



// CW

let cw=document.getElementById("cwBtn");

if(data.cw)
cw.classList.add("btn-active");
else
cw.classList.remove("btn-active");



// CCW

let ccw=document.getElementById("ccwBtn");

if(data.ccw)
ccw.classList.add("btn-active");
else
ccw.classList.remove("btn-active");


}



//----------------------------
// USUARIOS CONECTADOS
//----------------------------

if(message.destinationName===TOP_USUARIOS){


let datos;

try{

datos=JSON.parse(message.payloadString);

}catch(e){

return;

}


usuarios=datos.total || 0;


soyMandante=(datos.mandante===clientId);


actualizarControl();


}

}



//==============================
// ACTUALIZAR INDICADOR CONTROL
//==============================


function actualizarControl(){


let texto;


if(soyMandante){

texto="Control: MANDANTE";

activarBotones(true);


}else{

texto="Control: OBSERVADOR";

activarBotones(false);

}


document.getElementById("control").innerHTML=
texto+
"<br>Conectados: "+
usuarios;


}




//==============================
// HABILITAR BOTONES
//==============================


function activarBotones(valor){


document.getElementById("powerBtn").disabled=!valor;

document.getElementById("cwBtn").disabled=!valor;

document.getElementById("ccwBtn").disabled=!valor;


}


//==============================
// ENVIO MQTT
//==============================


function enviarComando(cmd){


if(!soyMandante){

return;

}


if(!client.isConnected()){

return;

}


let message=new Paho.MQTT.Message(cmd);

message.destinationName=TOP_CONTROL;

client.send(message);


}
    //==============================
// BOTONES MOMENTANEOS CW / CCW
//==============================

let cwPressed=false;
let ccwPressed=false;


//==============================
// GIRO HORARIO
//==============================

function botonCW(estado){

if(!soyMandante)return;


if(estado){

if(!cwPressed){

cwPressed=true;

enviarComando("CW_ON");

}

}else{

if(cwPressed){

cwPressed=false;

enviarComando("CW_OFF");

}

}

}



//==============================
// GIRO ANTIHORARIO
//==============================

function botonCCW(estado){

if(!soyMandante)return;


if(estado){

if(!ccwPressed){

ccwPressed=true;

enviarComando("CCW_ON");

}

}else{

if(ccwPressed){

ccwPressed=false;

enviarComando("CCW_OFF");

}

}

}



//==============================
// SEGURIDAD
// AL PERDER FOCO
// LIBERA MOVIMIENTO
//==============================

window.addEventListener("blur",function(){


if(cwPressed){

cwPressed=false;

enviarComando("CW_OFF");

}


if(ccwPressed){

ccwPressed=false;

enviarComando("CCW_OFF");

}


});




//==============================
// AVISO AL SALIR
// LIBERA CONTROL
//==============================


window.addEventListener("beforeunload",function(){


if(cwPressed){

enviarComando("CW_OFF");

}


if(ccwPressed){

enviarComando("CCW_OFF");

}


if(client.isConnected()){


let msg=new Paho.MQTT.Message(clientId);

msg.destinationName=TOP_LOGOUT;

client.send(msg);


}

});




//==============================
// EVITAR MENU CONTEXTUAL MOVIL
//==============================


document.addEventListener(
"contextmenu",
function(e){
e.preventDefault();
}
);


</script>

</body>
</html>
